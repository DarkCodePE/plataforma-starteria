services:
  postgres:
    image: "${STARTERIA_CI_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${E2E_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: "axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a"
    ports:
      - "127.0.0.1:${E2E_MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${E2E_MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
