<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starteria — Unified E2E TO-BE v0.1</title>
  <style>
    :root { --ink:#152338;--muted:#60708a;--paper:#f6f8fc;--line:#dbe3ef;--blue:#2356d8;--mint:#d9f4e9;--amber:#fff0c7;--rose:#ffe5e8; }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
    header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:16px;align-items:center}.brand{font-weight:800;font-size:18px}.tag{padding:3px 8px;background:var(--amber);border-radius:99px;font-size:12px;font-weight:700}.meta{margin-left:auto;color:var(--muted);font-size:12px}
    .shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 55px)} aside{padding:18px;border-right:1px solid var(--line);background:#fff}.nav-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;margin:18px 0 6px}.nav-title:first-child{margin-top:0}button{font:inherit;cursor:pointer}.nav button{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:8px 10px;color:#43526b}.nav button:hover,.nav button.active{color:var(--blue);background:#edf2ff;font-weight:700}.sim{margin:16px 0;padding:10px;border-radius:8px;background:var(--amber);font-size:12px}.body{max-width:1120px;width:100%;padding:32px;margin:auto}.crumb{color:var(--blue);font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #10203008}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}h1{font-size:30px;line-height:1.15;margin:8px 0}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}.muted{color:var(--muted)}.kpi{font-size:26px;font-weight:800}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:99px;font-size:12px;margin:3px 4px 0 0}.pill.good{background:var(--mint);border-color:#bce8d7}.pill.warn{background:var(--amber);border-color:#f4d678}.pill.risk{background:var(--rose);border-color:#f1bdc5}.action{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:9px 13px;font-weight:700}.secondary{background:#fff;color:var(--blue);border:1px solid #b8c9f8}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:flex;justify-content:space-between;gap:14px}.list{margin:8px 0;padding-left:20px}.notice{padding:11px 13px;background:#edf2ff;border-left:3px solid var(--blue);border-radius:5px}.warnbox{padding:11px 13px;background:#fff9e8;border-left:3px solid #d89b00;border-radius:5px}.dangerbox{padding:11px 13px;background:#fff1f2;border-left:3px solid #d03a4b;border-radius:5px}.steps{display:flex;gap:5px}.steps span{padding:5px 8px;border-radius:6px;background:#e9eef7;color:var(--muted);font-size:12px}.steps span.current{background:var(--blue);color:#fff;font-weight:700}.field{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fbfcff}.label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.dialog{border:1px solid #b8c9f8;background:#f6f8ff;border-radius:10px;padding:13px;margin:10px 0}.source{font-size:12px;color:var(--muted);padding:7px;border-top:1px solid var(--line);margin-top:8px}.status{font-size:12px;font-weight:800}.status.proposed{color:#9a6a00}.status.confirmed{color:#137553}.status.unknown{color:#6a518f}.status.review{color:#b0303e}@media(max-width:800px){.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.nav-title{display:none}.wide,.side{grid-column:1/-1}.meta{display:none}.body{padding:18px}}
  </style>
</head>
<body>
<header><div class="brand">starteria</div><span class="tag">TO-BE SIMULATION — NOT RUNTIME</span><div class="meta">P2 frozen experience · P3 reasoning/Card contract · v0.1</div></header>
<div class="shell"><aside><div class="nav" id="nav"></div><div class="sim">All names, metrics, sources and outcomes are simulated fixtures. This prototype does not assert deployed APIs, AI behavior, persistence, permissions or E2E operation.</div></aside><main class="body" id="app"></main></div>
<script>
const screens={
 entry:{group:'ENTRY',label:'Portfolio Entry',crumb:'Optional upstream entry',title:'What outcome do you want to change?',sub:'A provisional, conversational orientation. It remains separate from Portfolio Lead.',content:`<div class="grid"><section class="card wide"><div class="dialog"><b>Copilot · simulated</b><br>I can help organize the outcome and context. I will not confirm strategy or create an Initiative.</div><div class="field"><span class="label">Declared outcome</span><br>Reduce manual order reconciliation time without losing control.</div><div class="row"><button class="action" data-go="lead">Review with Portfolio Lead</button><span class="pill warn">provisional interpretation</span></div></section><aside class="card side"><h3>Recovered context</h3><p class="muted">No confirmed organization authority is assumed from this entry.</p><div class="source">SIMULATED · Entry context ref E-102</div></aside></div>`},
 lead:{group:'PORTFOLIO LEAD',label:'Lead setup',crumb:'Portfolio Lead',title:'Set the strategic frame',sub:'Frozen Portfolio Lead sequence represented as a simulation.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Business result</span><br>Reconciliation time decreases while finance control remains intact.</div><div class="field"><span class="label">Signal / baseline / horizon</span><br>42 min/order · target under 20 min · Q3</div><div class="row"><span class="pill good">human review required for material alignment</span><button class="action" data-go="portfolio">Continue to Portfolio</button></div></section><aside class="card side"><h3>Context</h3><p class="muted">Constraints, sources and unknowns remain visible. Visual grouping does not create a canonical domain relation.</p><div class="source">SIMULATED · mandate draft M-88</div></aside></div>`},
 portfolio:{group:'PORTFOLIO LEAD',label:'Portfolio',crumb:'Portfolio · coverage and initiatives',title:'Read the portfolio',sub:'Coverage, contribution and overlap are governance signals, not automatic strategic truth.',content:`<div class="grid"><section class="card wide"><div class="split"><div><h2>Order operations</h2><span class="pill good">1 active Initiative</span><span class="pill warn">1 Challenge without Initiative</span></div><div class="kpi">62%<div class="muted" style="font-size:12px">simulated coverage</div></div></div><hr><div class="row"><button class="secondary action" data-go="analysis">Analyze existing Initiative</button><button class="action" data-go="brief">Organize Challenge into brief</button></div></section><aside class="card side"><h3>Attention</h3><p><span class="status unknown">UNKNOWN</span> source for baseline variance</p><p><span class="status review">REQUIRES REVIEW</span> overlap signal needs human disposition</p><div class="source">SIMULATED · portfolio read model</div></aside></div>`},
 analysis:{group:'PORTFOLIO LEAD',label:'Initiative analysis',crumb:'Portfolio · existing initiative intake',title:'Existing Initiative intake',sub:'Identity, sources and history are preserved; documentary reconstruction is not Step approval.',content:`<div class="grid"><section class="card wide"><h2>Initiative I-217 · “Reconciliation assistant”</h2><div class="field"><span class="label">Known history</span><br>Three interviews, two operational observations, previous Step 1 draft.</div><div class="field"><span class="label">Gaps</span><br>Current baseline source not verified; Step/cycle continuation not selected here.</div><button class="action" data-go="assignment">Create handoff for same Initiative</button></section><aside class="card side"><h3>Integrity</h3><p class="status confirmed">same Initiative identity</p><p class="status unknown">cycle / Step effective: deferred to governed rule</p><div class="source">SIMULATED · I-217 references retained</div></aside></div>`},
 brief:{group:'HANDOFF',label:'Brief',crumb:'Challenge · brief',title:'Prepare a revisable brief',sub:'Brief transfers a mandate and references; it is not a Decision Package.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Challenge</span><br>Reduce reconciliation effort with verifiable operational safeguards.</div><div class="field"><span class="label">Expected decision</span><br>Whether to fund a limited operational trial.</div><button class="action" data-go="assignment">Assign work</button></section><aside class="card side"><h3>Transfer envelope</h3><span class="pill">objective</span><span class="pill">constraint</span><span class="pill">horizon</span><span class="pill">SourceRefs</span><div class="source">SIMULATED · snapshot, not duplicate truth</div></aside></div>`},
 assignment:{group:'HANDOFF',label:'Assignment',crumb:'Handoff · Assignment',title:'Assign an accountable owner',sub:'Assign, Accept, Reject and Start are separate transitions.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Assignment A-421</span><br>Target: Challenge C-72 · owner proposal: Ana · Initiative: none confirmed</div><div class="row"><button class="action" data-go="accept">Accept</button><button class="secondary action" data-go="reject">Reject</button></div></section><aside class="card side"><h3>Boundary</h3><p>Assignment has its own identity. No Initiative is created by assignment.</p><div class="source">SIMULATED · HandoffAssignment A-421</div></aside></div>`},
 accept:{group:'HANDOFF',label:'Accept',crumb:'Handoff · Accept',title:'Owner accepts responsibility',sub:'Accept is not execution and does not create an Initiative.',content:`<div class="grid"><section class="card wide"><div class="notice"><b>Accepted · simulated</b><br>Responsibility is recorded conceptually. Steps are not active.</div><button class="action" data-go="start">Start accepted work</button></section><aside class="card side"><h3>Audit expectation</h3><p>Assignment event, actor and version are needed in product later.</p><div class="source">SIMULATED · no persisted event claimed</div></aside></div>`},
 reject:{group:'HANDOFF',label:'Reject',crumb:'Handoff · Reject',title:'Reject with a reason',sub:'A rejection is visible to Portfolio and does not silently reactivate ownership.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Reason</span><br>Required capacity is unavailable before the decision horizon.</div><div class="dangerbox">SIMULATED rejection. Portfolio may respond within its authority; no Step state exists to mutate.</div><button class="action" data-go="assignment">Return to assignment</button></section><aside class="card side"><h3>State</h3><p class="status review">reason required</p></aside></div>`},
 start:{group:'POST-START',label:'Start',crumb:'Handoff · Start',title:'Start accepted work',sub:'Start marks work as started. It is not Initiative creation or Step activation.',content:`<div class="grid"><section class="card wide"><div class="notice"><b>Start boundary · simulated</b><br>Choose the continuity that matches the actual context. This chooser illustrates P2 Route A/B/C; it does not select a production command.</div><div class="row"><button class="action" data-go="routeA">A · Challenge, no Initiative</button><button class="secondary action" data-go="routeB">B · Existing Initiative</button><button class="secondary action" data-go="routeC">C · Independent Initiative</button></div></section><aside class="card side"><h3>Invariant</h3><p>Start ≠ Create Initiative ≠ Activate Step.</p></aside></div>`},
 routeA:{group:'POST-START',label:'Route A',crumb:'Route A · formulation',title:'Formulate a candidate Initiative',sub:'A Challenge Assignment has started, but no Initiative is final yet.',content:`<div class="grid"><section class="card wide"><div class="dialog"><b>Copilot · simulated formulation</b><br>Candidate: “Reduce reconciliation time through exception triage.”<br><span class="status proposed">PROPOSED · needs human confirmation</span></div><div class="field"><span class="label">Inherited mandate snapshot</span><br>Challenge C-72 · Q3 horizon · controls constraint · refs S-1, S-2</div><button class="action" data-go="confirmA">Review and confirm Initiative</button></section><aside class="card side"><h3>Not created</h3><p>There is no canonical Initiative until confirmation.</p><div class="source">SIMULATED · candidate only</div></aside></div>`},
 confirmA:{group:'POST-START',label:'Route A confirm',crumb:'Route A · human confirmation',title:'Human confirmation creates one Initiative',sub:'The checkpoint distinguishes formulation from the canonical identity.',content:`<div class="grid"><section class="card wide"><div class="notice"><b>Confirmation · simulated</b><br>Exactly one Initiative would be created by the later governed command. This prototype does not persist it.</div><button class="action" data-go="overviewA">Open Initiative Overview</button></section><aside class="card side"><h3>Required later</h3><p>Authorized actor, command, idempotency and audit event.</p></aside></div>`},
 routeB:{group:'POST-START',label:'Route B',crumb:'Route B · reconstruction',title:'Continue the existing Initiative',sub:'The same identity, sources and history are recovered.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">I-217 retained</span><br>History and evidence: preserved. Documentary work: visible. Methodological approval: not inferred.</div><div class="warnbox">Gap: current baseline evidence is missing. The effective cycle/Step requires the governed rule.</div><button class="action" data-go="overviewB">Open continuity Overview</button></section><aside class="card side"><h3>Invariant</h3><p class="status confirmed">no duplicate Initiative</p><p class="status review">no retroactive Step approval</p></aside></div>`},
 routeC:{group:'POST-START',label:'Route C',crumb:'Route C · independent formulation',title:'Formulate an independent Initiative',sub:'No StrategicFront, Challenge or corporate sponsor is invented.',content:`<div class="grid"><section class="card wide"><div class="dialog"><b>Copilot · simulated</b><br>Organize the user’s independent outcome, constraints and current uncertainty.</div><div class="field"><span class="label">Candidate context</span><br>Independent workflow experiment · organization context unknown</div><button class="action" data-go="confirmC">Review and confirm Initiative</button></section><aside class="card side"><h3>Context</h3><p class="status unknown">corporate hierarchy: not applicable / unknown by context</p></aside></div>`},
 confirmC:{group:'POST-START',label:'Route C confirm',crumb:'Route C · human confirmation',title:'Confirm one independent Initiative',sub:'A person confirms the formulation before the Initiative identity exists.',content:`<div class="grid"><section class="card wide"><div class="notice">SIMULATED confirmation. One independent Initiative would be created by a later governed command.</div><button class="action" data-go="overviewC">Open Initiative Overview</button></section><aside class="card side"><p>No corporate Portfolio return is fabricated where context does not support it.</p></aside></div>`},
 overviewA:{group:'INITIATIVE',label:'Overview',crumb:'Initiative I-218 · Overview',title:'Initiative Overview',sub:'The bridge into Core makes origin, mandate, gaps and next action visible.',content:''},
 overviewB:{group:'INITIATIVE',label:'Overview',crumb:'Initiative I-217 · Overview',title:'Initiative Overview',sub:'The bridge into Core makes origin, mandate, gaps and next action visible.',content:''},
 overviewC:{group:'INITIATIVE',label:'Overview',crumb:'Independent Initiative · Overview',title:'Initiative Overview',sub:'The bridge into Core makes origin, mandate, gaps and next action visible.',content:''},
 step0:{group:'INITIATIVE CORE',label:'Step 0',crumb:'Initiative Core · Step 0',title:'Step 0 · Frame this cycle',sub:'The first golden-slice target: context, constraint, intended decision and open uncertainty.',content:''},
 step1:{group:'INITIATIVE CORE',label:'Step 1',crumb:'Initiative Core · Step 1',title:'Step 1 · Establish truth and focus',sub:'Facts, assumptions and hypotheses stay distinct.',content:''},
 step2:{group:'INITIATIVE CORE',label:'Step 2',crumb:'Initiative Core · Step 2',title:'Step 2 · Prepare execution',sub:'Execution-ready work, measurement plan and external capacity boundary.',content:''},
 step3:{group:'INITIATIVE CORE',label:'Step 3',crumb:'Initiative Core · Step 3',title:'Step 3 · Observe execution',sub:'Observation and interpretation remain distinct, including negative evidence.',content:''},
 step4:{group:'INITIATIVE CORE',label:'Step 4',crumb:'Initiative Core · Step 4',title:'Step 4 · Consolidate learning',sub:'Prepare a Decision Package; do not make the organizational decision.',content:''},
 decision:{group:'DECISION',label:'Decision',crumb:'Decision Package · human decision',title:'Human decision',sub:'Recommendation is separate from an authorized organizational decision.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Decision Package · simulated</span><br>Evidence, learning, options, limits, expected/observed maturity and requested decision.</div><div class="dialog"><b>Recommendation · simulated</b><br>Run a controlled trial with finance validator.<br><span class="status proposed">AI/team recommendation — not a decision</span></div><button class="action" data-go="return">Authorized human decision → Portfolio return</button></section><aside class="card side"><h3>Decision authority</h3><p>Actor/type matrix remains technical/governance work. The prototype never assigns authority automatically.</p></aside></div>`},
 return:{group:'PORTFOLIO RETURN',label:'Portfolio return',crumb:'Portfolio · causal return',title:'Return a governed signal to Portfolio',sub:'Portfolio reads the result without rewriting Initiative history or Step state.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Causal chain · simulated</span><br>Initiative → cycle → Step outputs → Decision Package → human decision → Portfolio update</div><div class="row"><span class="pill good">decision reference</span><span class="pill">evidence signal</span><span class="pill warn">benefit tracking later when applicable</span></div><button class="action" data-go="benefits">Open Benefit Tracking</button><button class="secondary action" data-go="portfolio">Back to Portfolio</button></section><aside class="card side"><h3>Impact integrity</h3><p>Expected, observed and attributed remain separate.</p></aside></div>`},
 benefits:{group:'PORTFOLIO RETURN',label:'Benefit Tracking',crumb:'Benefit Tracking',title:'Track benefit after development when applicable',sub:'Step 4 may close the development cycle before long-term value is observable.',content:`<div class="grid"><section class="card wide"><div class="field"><span class="label">Expected</span><br>20 minutes/order target · simulated</div><div class="field"><span class="label">Observed</span><br><span class="status unknown">UNKNOWN</span> operational measurement not yet supplied</div><div class="field"><span class="label">Attributed</span><br><span class="status unknown">requires method and validator</span></div></section><aside class="card side"><h3>Provenance</h3><p>Each impact claim needs source, method and assumptions. No ROI is invented.</p></aside></div>`}
};
function overview(name){const id=name==='overviewB'?'I-217':name==='overviewC'?'Independent candidate':'I-218';return `<div class="grid"><section class="card wide"><div class="steps"><span class="current">Overview</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div><h2 style="margin-top:16px">${id}</h2><div class="field"><span class="label">Origin / mandate</span><br>${name==='overviewC'?'Independent, human-confirmed formulation':'Handoff context, snapshot and SourceRefs retained'}</div><div class="field"><span class="label">Next permitted action</span><br>Begin Step 0 when the governed cycle/activation condition is satisfied.</div><button class="action" data-go="step0">Open Step 0</button></section><aside class="card side"><h3>Known gaps</h3><p class="status unknown">baseline evidence pending</p><p class="status review">material changes require directed review</p><div class="source">SIMULATED · Overview is not an extra Step</div></aside></div>`}
function step(n){const names=['Frame cycle','Truth and focus','Prepare execution','Observe execution','Consolidate learning'];const card=[`<div class="field"><span class="label">Cycle intent</span><br>Clarify the result, inherited constraints and decision this cycle should enable.</div><div class="field"><span class="label">Open unknown</span><br><span class="status unknown">Which reconciliation exception causes most delay?</span></div>`,`<div class="field"><span class="label">Facts / assumptions / hypotheses</span><br>Facts: 3 interviews. Assumption: automation is the bottleneck. Hypothesis: exception triage drives the delay.</div>`,`<div class="field"><span class="label">Execution + measurement plan</span><br>Prototype triage rules; measure handled exceptions and control exceptions. IT access remains a dependency.</div>`,`<div class="field"><span class="label">Observation</span><br>Negative evidence is retained if triage does not reduce time.</div>`,`<div class="field"><span class="label">Learning + Decision Package</span><br>Summarize evidence, limits, recommendation and requested decision.</div>`][n];return `<div class="grid"><section class="card wide"><div class="steps">${[0,1,2,3,4].map(x=>`<span class="${x===n?'current':''}">${x}</span>`).join('')}</div><div class="dialog"><b>Copilot · simulated</b><br>${n===0?'I recovered the mandate snapshot. What evidence identifies the current bottleneck?':n===1?'The assumption is not a fact. Link a source or keep it as a hypothesis.':n===2?'The team can prepare the trial; IT access needs an unblock path.':n===3?'Record what occurred separately from how you interpret it.':'I can prepare the package. A human still decides.'}</div>${card}<div class="row">${n<4?`<button class="action" data-go="step${n+1}">View Step ${n+1}</button>`:`<button class="action" data-go="decision">Prepare Decision Package</button>`}<span class="pill warn">Card delta: simulated</span></div></section><aside class="card side"><h3>Live Card</h3><p><span class="status proposed">PROPOSED</span> structured delta awaits applicable review.</p><p><span class="status unknown">UNKNOWN</span> remains unmet, not converted into text.</p><div class="source">SIMULATED · sources and versions would be shown here</div></aside></div>`}
function render(key){const s=screens[key]||screens.entry;let content=s.content;if(key.startsWith('overview'))content=overview(key);if(/^step[0-4]$/.test(key))content=step(Number(key.slice(4)));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===key));app.innerHTML=`<div class="crumb">${s.crumb}</div><h1>${s.title}</h1><p class="muted">${s.sub}</p>${content}`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));history.replaceState(null,'','#'+key)}
const nav=document.getElementById('nav');let last='';Object.entries(screens).forEach(([id,s])=>{if(s.group!==last){nav.insertAdjacentHTML('beforeend',`<div class="nav-title">${s.group}</div>`);last=s.group}nav.insertAdjacentHTML('beforeend',`<button data-go="${id}">${s.label}</button>`)});render(location.hash.slice(1)||'entry');
</script>
</body>
</html>
