# CD is deliberately manual. Merging to main or pushing a release tag must not
# publish images, apply migrations, or deploy production. An operator starts a
# workflow_dispatch run and the `production` environment authorizes the release
# before any image is published. Keep the environment protection enabled: an
# environment name without required reviewers is only a label, not a gate.
name: CD

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-hex commit SHA to deploy (rollback/redeploy). Empty = tip of the selected ref.'
        required: false
        default: ''
        type: string
      reason:
        description: 'Why this manual run (shown in the run summary)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: starteria-production
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: orlandogtp
  NAMESPACE: starteria
  ROLLOUT_TIMEOUT: 360s

jobs:
  # Single source of truth for "which commit ships, under which tag". This
  # read-only resolution runs before the approval request so reviewers see the
  # exact target. Nothing is built, published, migrated, or deployed yet.
  resolve:
    name: Resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
      channel: ${{ steps.target.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and verify release target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.source_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # workflow_dispatch may be launched from any ref in the GitHub UI.
          # Keep a closed allowlist: main and semver tags only.
          case "$EVENT_NAME:$REF" in
            workflow_dispatch:refs/heads/main|workflow_dispatch:refs/tags/*)
              channel=manual ;;
            *)
              echo "::error::CD accepts only a manual dispatch from main or a vX.Y.Z tag (got $EVENT_NAME on $REF)"
              exit 1 ;;
          esac

          # The `on:` glob is laxer than it looks; validate the tag name for real.
          if [[ "$REF" == refs/tags/* ]]; then
            [[ "$REF_NAME" =~ $semver ]] || { echo "::error::Tag $REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          fi

          sha="${INPUT_SHA:-$HEAD_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Resolved commit must be a full 40-character lowercase SHA'; exit 1; }

          # Anchored on origin/main rather than the event's own HEAD, where the
          # check was a tautology. This now rejects a tag cut on a branch that
          # was never merged to main.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${sha}^{commit}" 2>/dev/null \
            || { echo "::error::Commit $sha is not in this repository's history"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Commit $sha is not reachable from origin/main; refusing to deploy"; exit 1; }

          # One tag rule: a semver tag ships under its own name unless the
          # operator overrode the SHA; everything else ships as main-<7sha>.
          if [[ "$REF" == refs/tags/* && -z "${INPUT_SHA:-}" ]]; then
            tag="$REF_NAME"
          else
            tag="main-${sha:0:7}"
          fi

          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

          # Written before the production approval request so whoever approves
          # can read exactly which commit and tag they are authorizing.
          {
            printf '## CD target\n\n'
            printf -- '- Trigger: `%s` on `%s` (channel `%s`)\n' "$EVENT_NAME" "$REF" "$channel"
            printf -- '- Commit: `%s`\n' "$sha"
            printf -- '- Image tag: `%s`\n' "$tag"
            if [[ -n "${REASON:-}" ]]; then printf -- '- Reason: %s\n' "$REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  authorize:
    name: Authorize production release
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Record authorization boundary
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          printf '## Production authorization\n\n- Authorized commit: `%s`\n- Authorized image tag: `%s`\n- No image publication, migration, or deployment occurred before this gate.\n' "$SOURCE_SHA" "$TAG" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: CI gate
    needs: [resolve, authorize]
    uses: ./.github/workflows/ci.yml

  step-reasoning-qa-config:
    name: Validate synthetic Step Copilot exposure
    needs: [resolve, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Validate fail-closed QA flags
        env:
          STEP_REASONING_COPILOT_ENABLED: ${{ vars.STEP_REASONING_COPILOT_ENABLED || 'false' }}
          STEP_REASONING_QA_USER_IDS: ${{ vars.STEP_REASONING_QA_USER_IDS }}
          STEP_REASONING_PROVIDER_MODE: qa_stub
        run: bash scripts/ci/validate-step-reasoning-qa-config.sh

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: [tests, step-reasoning-qa-config, resolve, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile.backend
          - service: frontend
            context: .
            dockerfile: Dockerfile.frontend
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build immutable release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_STEP_REASONING_COPILOT_ENABLED=${{ vars.STEP_REASONING_COPILOT_ENABLED || 'false' }}
            VITE_STEP_REASONING_QA_USER_IDS=${{ vars.STEP_REASONING_QA_USER_IDS }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/starteria-${{ matrix.service }}:${{ needs.resolve.outputs.tag }}

  deploy:
    name: Deploy to Rackspace Spot
    # `resolve` is listed explicitly: needs.<job>.outputs is NOT inherited
    # transitively through build-and-push.
    needs: [build-and-push, resolve, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep the environment on the deploy job as a second protection boundary
    # and as the source of production-scoped secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Check required credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RACKSPACE_REFRESH_TOKEN: ${{ secrets.RACKSPACE_REFRESH_TOKEN }}
          RACKSPACE_ORG_NAME: ${{ secrets.RACKSPACE_ORG_NAME }}
          RACKSPACE_CLOUDSPACE_NAME: ${{ secrets.RACKSPACE_CLOUDSPACE_NAME }}
          STARTERIA_JWT_SECRET: ${{ secrets.STARTERIA_JWT_SECRET }}
          STARTERIA_DB_PASSWORD: ${{ secrets.STARTERIA_DB_PASSWORD }}
          STARTERIA_AI_SERVICE_TOKEN: ${{ secrets.STARTERIA_AI_SERVICE_TOKEN }}
          STARTERIA_BRIDGE_SHARED_SECRET: ${{ secrets.STARTERIA_BRIDGE_SHARED_SECRET }}
          STARTERIA_BILLING_WEBHOOK_SECRET: ${{ secrets.STARTERIA_BILLING_WEBHOOK_SECRET }}
          STARTERIA_PILOT_CODE_SECRET: ${{ secrets.STARTERIA_PILOT_CODE_SECRET }}
          BILLING_WEBHOOKS_ENABLED: ${{ vars.BILLING_WEBHOOKS_ENABLED || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          PORTFOLIO_ENTRY_API_KEY: ${{ secrets.PORTFOLIO_ENTRY_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN RACKSPACE_REFRESH_TOKEN RACKSPACE_ORG_NAME RACKSPACE_CLOUDSPACE_NAME STARTERIA_JWT_SECRET STARTERIA_DB_PASSWORD STARTERIA_AI_SERVICE_TOKEN STARTERIA_BRIDGE_SHARED_SECRET OPENROUTER_API_KEY JEV_API_KEY PORTFOLIO_ENTRY_API_KEY GOOGLE_CLIENT_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required secret $name"; exit 1; }
          done
          bash scripts/ci/validate-production-secrets.sh
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Fetch kubeconfig from Rackspace Spot
        env:
          RACKSPACE_REFRESH_TOKEN: ${{ secrets.RACKSPACE_REFRESH_TOKEN }}
          RACKSPACE_ORG_NAME: ${{ secrets.RACKSPACE_ORG_NAME }}
          RACKSPACE_CLOUDSPACE_NAME: ${{ secrets.RACKSPACE_CLOUDSPACE_NAME }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg org "$RACKSPACE_ORG_NAME" --arg cs "$RACKSPACE_CLOUDSPACE_NAME" --arg rt "$RACKSPACE_REFRESH_TOKEN" '{organization_name:$org,cloudspace_name:$cs,refresh_token:$rt}')
          response="$RUNNER_TEMP/spot-response.json"
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST 'https://spot.rackspace.com/apis/auth.ngpc.rxt.io/v1/generate-kubeconfig' --header 'Content-Type: application/json' --data "$payload")
          [[ "$status" == 200 ]] || { echo "::error::Rackspace kubeconfig request failed (HTTP $status)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/kube"
          jq -er '.data.kubeconfig' "$response" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          rm -f "$response"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Preflight live deployment and database
        env:
          DB_PASSWORD: ${{ secrets.STARTERIA_DB_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" get statefulset/starteria-db secret/cloudflared-token
          # The live password's source of truth is the StatefulSet's own env. It is an
          # inline literal there, not secret/starteria-db-secrets, which does not exist
          # in this cluster. Requiring that secret made the preflight fail before it
          # could check anything. Read the secret when present, fall back to the
          # StatefulSet literal otherwise.
          live_password=$(kubectl -n "$NAMESPACE" get secret/starteria-db-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/dev/null | base64 --decode || true)
          if [[ -z "$live_password" ]]; then
            live_password=$(kubectl -n "$NAMESPACE" get statefulset/starteria-db -o "jsonpath={.spec.template.spec.containers[0].env[?(@.name=='POSTGRES_PASSWORD')].value}")
          fi
          [[ -n "$live_password" ]] || { echo '::error::Could not read the live database password from either the Secret or the StatefulSet'; exit 1; }
          [[ "$live_password" == "$DB_PASSWORD" ]] || { echo '::error::GitHub database password differs from the live cluster; stop and resolve credential rotation separately'; exit 1; }
          for svc in backend frontend ai-service; do
            image=$(kubectl -n "$NAMESPACE" get "deployment/starteria-$svc" -o "jsonpath={.spec.template.spec.containers[?(@.name=='$svc')].image}")
            [[ -n "$image" ]] || { echo "::error::No live image for $svc"; exit 1; }
            printf '%s\n' "$image" > "$RUNNER_TEMP/previous-$svc-image"
          done
      - name: Sync Kubernetes secrets
        env:
          DB_PASSWORD: ${{ secrets.STARTERIA_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.STARTERIA_JWT_SECRET }}
          AI_SERVICE_TOKEN: ${{ secrets.STARTERIA_AI_SERVICE_TOKEN }}
          BRIDGE_SHARED_SECRET: ${{ secrets.STARTERIA_BRIDGE_SHARED_SECRET }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.STARTERIA_BILLING_WEBHOOK_SECRET }}
          # Optional on first deploy. sync-backend-secret.sh preserves the existing
          # cluster key or generates and persists a strong key exactly once.
          PILOT_CODE_SECRET: ${{ secrets.STARTERIA_PILOT_CODE_SECRET }}
          BILLING_WEBHOOKS_ENABLED: ${{ vars.BILLING_WEBHOOKS_ENABLED || 'false' }}
          PORTFOLIO_ENTRY_API_KEY: ${{ secrets.PORTFOLIO_ENTRY_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SMTP_HOST: ${{ secrets.STARTERIA_SMTP_HOST }}
          SMTP_USER: ${{ secrets.STARTERIA_SMTP_USER }}
          SMTP_PASS: ${{ secrets.STARTERIA_SMTP_PASS }}
          PILOT_LEAD_NOTIFY_FROM: ${{ secrets.STARTERIA_PILOT_LEAD_NOTIFY_FROM }}
          STEP_REASONING_COPILOT_ENABLED: ${{ vars.STEP_REASONING_COPILOT_ENABLED || 'false' }}
          STEP_REASONING_QA_USER_IDS: ${{ vars.STEP_REASONING_QA_USER_IDS }}
          STEP_REASONING_PROVIDER_MODE: qa_stub
        run: |
          set -euo pipefail
          bash scripts/ci/validate-step-reasoning-qa-config.sh
          encoded_password=$(jq -nr --arg v "$DB_PASSWORD" '$v|@uri')
          database_url="postgresql://starteria:${encoded_password}@starteria-db:5432/starteria_db"
          kubectl -n "$NAMESPACE" create secret generic starteria-db-secrets --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          export DATABASE_URL="$database_url"
          bash scripts/ci/sync-backend-secret.sh
          kubectl -n "$NAMESPACE" create configmap starteria-step-reasoning-qa \
            --from-literal=STEP_REASONING_COPILOT_ENABLED="$STEP_REASONING_COPILOT_ENABLED" \
            --from-literal=STEP_REASONING_QA_USER_IDS="$STEP_REASONING_QA_USER_IDS" \
            --from-literal=STEP_REASONING_PROVIDER_MODE="$STEP_REASONING_PROVIDER_MODE" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic starteria-ai-service-secrets \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" --from-literal=JEV_API_KEY="$JEV_API_KEY" \
            --from-literal=LANGSMITH_API_KEY="${LANGSMITH_API_KEY:-}" \
            --from-literal=AI_SERVICE_INTERNAL_TOKEN="$AI_SERVICE_TOKEN" --from-literal=BACKEND_WEBHOOK_TOKEN="$AI_SERVICE_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      # Schema antes que imágenes: las migraciones que aplica el CD son sólo aditivas, así que el
      # código que sigue corriendo durante el rollout no se rompe, y el código nuevo no arranca
      # contra columnas que no existen (2026-09-25 → 2026-10-07: portafolio en 500 por esto).
      # Una migración no aditiva corta el deploy acá y va por db-schema-sync.yml con revisión.
      # Si el rollout falla y se restauran las imágenes, el schema queda aplicado: es aditivo.
      - name: Apply pending database migrations
        id: migrate
        run: scripts/ci/prod-db-migrate.sh apply
      - name: Apply manifests and set release images
        id: rollout
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Use image-substituted manifests so apply never briefly rolls a service
          # back to the old hard-coded image or :latest placeholder.
          # The database is deliberately NOT applied here. k8s/postgres-statefulset.yaml
          # declares POSTGRES_PASSWORD via secretKeyRef while the live StatefulSet
          # carries it as an inline literal, so applying it changes the pod template
          # and restarts production Postgres on every first-time run. An application
          # deploy pipeline should not redeploy the database; manage the StatefulSet
          # deliberately and out of band.
          kubectl -n "$NAMESPACE" apply \
            -f k8s/backend-service.yaml -f k8s/frontend-service.yaml -f k8s/ai-service-service.yaml \
            -f k8s/cloudflared-service.yaml
          # El PVC va antes del Deployment que lo monta. Aplicarlo de nuevo no toca un PVC ya creado.
          kubectl -n "$NAMESPACE" apply -f k8s/backend-storage-pvc.yaml
          for svc in backend frontend ai-service; do
            manifest="k8s/$svc-deployment.yaml"
            # Match any registry/namespace on the left. The old pattern hardcoded
            # `orlandogtp` while the replacement used $DOCKERHUB_NAMESPACE, so
            # changing the namespace made the substitution stop matching in
            # silence: apply would ship the manifest's old image and `set image`
            # would correct it a moment later, which is exactly the intermediate
            # rollout the comment above says to avoid. Fail loudly instead.
            substituted=$(sed -E "s|image: [^[:space:]]+/starteria-$svc:[^[:space:]]+|image: ${DOCKERHUB_NAMESPACE}/starteria-$svc:${TAG}|" "$manifest")
            printf '%s\n' "$substituted" | grep -q "image: ${DOCKERHUB_NAMESPACE}/starteria-$svc:${TAG}" \
              || { echo "::error::Image substitution did not match in $manifest; refusing to apply"; exit 1; }
            printf '%s\n' "$substituted" | kubectl -n "$NAMESPACE" apply -f -
          done
          kubectl -n "$NAMESPACE" set env deployment/starteria-backend \
            --from=configmap/starteria-step-reasoning-qa
          kubectl -n "$NAMESPACE" apply -f k8s/cloudflared-deployment.yaml
          for svc in backend frontend ai-service; do
            kubectl -n "$NAMESPACE" set image "deployment/starteria-$svc" "$svc=${DOCKERHUB_NAMESPACE}/starteria-$svc:${TAG}"
          done
          for svc in backend frontend ai-service; do
            kubectl -n "$NAMESPACE" rollout status "deployment/starteria-$svc" --timeout="$ROLLOUT_TIMEOUT"
          done
      - name: Verify database schema and API after rollout
        id: post_rollout
        run: |
          set -euo pipefail
          scripts/ci/prod-db-migrate.sh verify
          bash scripts/ci/wait-for-http-health.sh https://starter-ia.com/api/health 12 5
      # /api/health no toca la base; este smoke sí (portafolio con sesión). Se activa con la
      # variable E2E_PROD_TENANT_READY=true, que se pone después de crear el tenant con
      # e2e-prod-tenant.yml: el secret solo no alcanza (el 2026-10-07 estaba cargado antes que el
      # usuario y el CD del #148 falló con 401).
      - name: Authenticated API smoke (E2E tenant)
        env:
          E2E_PROD_LEAD_PASSWORD: ${{ secrets.E2E_PROD_LEAD_PASSWORD }}
          TENANT_READY: ${{ vars.E2E_PROD_TENANT_READY }}
        run: |
          if [ "${TENANT_READY:-}" != "true" ] || [ -z "${E2E_PROD_LEAD_PASSWORD:-}" ]; then
            echo "::warning::tenant E2E no habilitado (vars.E2E_PROD_TENANT_READY): se omite el smoke con sesión"; exit 0
          fi
          scripts/ci/prod-api-smoke.sh
      - name: Report recoverable production incident
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        run: |
          echo '::error::A post-rollout verification failed. Images remain pinned to the authorized release.'
          echo '::error::Automatic rollback is disabled because schema compatibility with older images is not guaranteed.'
          echo '::error::Treat this run as a production incident and perform an authorized, evidence-based recovery.'
      - name: Report release
        if: always()
        # Every value goes through `env`. The previous version interpolated
        # the source_sha input inside the script body, which is a minor
        # expression-injection surface.
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          STATUS: ${{ steps.rollout.outcome }}
          MIGRATIONS: ${{ steps.migrate.outputs.pending || 'n/a' }}
          BACKUP: ${{ steps.migrate.outputs.backup || 'none' }}
        run: |
          printf '## Starteria CD\n\n- Channel: `%s`\n- Source commit: `%s`\n- Image tag: `%s`\n- Docker Hub: `%s/starteria-{backend,frontend,ai-service}:%s`\n- Namespace: `%s`\n- Migrations applied: `%s` (backup: `%s`)\n- Rollout: `%s`\n' "$CHANNEL" "$SOURCE_SHA" "$TAG" "$DOCKERHUB_NAMESPACE" "$TAG" "$NAMESPACE" "$MIGRATIONS" "$BACKUP" "$STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kube/config" "$RUNNER_TEMP/spot-response.json"
