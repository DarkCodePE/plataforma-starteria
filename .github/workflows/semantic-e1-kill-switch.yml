name: Semantic E1 Kill Switch

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEACTIVATE_SEMANTIC_E1 to stop new semantic E1 turns immediately.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: starteria-production
  cancel-in-progress: false

env:
  NAMESPACE: starteria

jobs:
  deactivate:
    name: Deactivate Semantic E1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate governed request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '::error::Kill switch may only run from main'; exit 1; }
          [[ "$CONFIRMATION" == DEACTIVATE_SEMANTIC_E1 ]] \
            || { echo '::error::Confirmation must be DEACTIVATE_SEMANTIC_E1'; exit 1; }

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Fetch kubeconfig from Rackspace Spot
        id: kubeconfig
        env:
          RACKSPACE_REFRESH_TOKEN: ${{ secrets.RACKSPACE_REFRESH_TOKEN }}
          RACKSPACE_ORG_NAME: ${{ secrets.RACKSPACE_ORG_NAME }}
          RACKSPACE_CLOUDSPACE_NAME: ${{ secrets.RACKSPACE_CLOUDSPACE_NAME }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg org "$RACKSPACE_ORG_NAME" --arg cs "$RACKSPACE_CLOUDSPACE_NAME" --arg rt "$RACKSPACE_REFRESH_TOKEN" '{organization_name:$org,cloudspace_name:$cs,refresh_token:$rt}')
          response="$RUNNER_TEMP/spot-response.json"
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST 'https://spot.rackspace.com/apis/auth.ngpc.rxt.io/v1/generate-kubeconfig' --header 'Content-Type: application/json' --data "$payload")
          [[ "$status" == 200 ]] || { echo "::error::Rackspace kubeconfig request failed (HTTP $status)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/kube"
          jq -er '.data.kubeconfig' "$response" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          rm -f "$response"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Apply kill switch and verify rollout
        run: |
          set -euo pipefail
          before_image=$(kubectl -n "$NAMESPACE" get deployment/starteria-backend -o "jsonpath={.spec.template.spec.containers[?(@.name=='backend')].image}")
          [[ -n "$before_image" ]] || { echo '::error::Backend image not found'; exit 1; }
          kubectl -n "$NAMESPACE" set env deployment/starteria-backend SEMANTIC_E1_ENABLED=false
          kubectl -n "$NAMESPACE" rollout status deployment/starteria-backend --timeout=5m
          after_image=$(kubectl -n "$NAMESPACE" get deployment/starteria-backend -o "jsonpath={.spec.template.spec.containers[?(@.name=='backend')].image}")
          [[ "$after_image" == "$before_image" ]] || { echo '::error::Kill switch must not change the backend image'; exit 1; }

          for attempt in {1..12}; do
            actual=$(curl --silent --show-error --fail https://starter-ia.com/api/health | jq -er '.release.flags.SEMANTIC_E1_ENABLED' 2>/dev/null || true)
            [[ "$actual" == false ]] && exit 0
            sleep 5
          done
          echo '::error::Public health metadata does not report Semantic E1 disabled'
          exit 1

      - name: Remove kubeconfig
        if: always()
        run: rm -rf "$RUNNER_TEMP/kube"
