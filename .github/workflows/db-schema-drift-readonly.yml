# Deriva de schema de solo lectura: compara la base de producción con lo que espera el código.
# El CD restaurado NO aplica schema (STARTERIA_CD_RESTORATION_REPORT.md §9), así que cada
# migración nueva hay que confirmarla acá antes de que el código que la usa llegue a producción.
# Mismo patrón que db-adaptive-cycle-readonly.yml: READ ONLY + ROLLBACK + guard.
name: DB Schema Drift (readonly)

on:
  workflow_dispatch:

concurrency:
  group: db-schema-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: starteria

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Fetch kubeconfig from Rackspace Spot API
        env:
          RACKSPACE_REFRESH_TOKEN: ${{ secrets.RACKSPACE_REFRESH_TOKEN }}
          RACKSPACE_ORG_NAME: ${{ secrets.RACKSPACE_ORG_NAME }}
          RACKSPACE_CLOUDSPACE_NAME: ${{ secrets.RACKSPACE_CLOUDSPACE_NAME }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg org "$RACKSPACE_ORG_NAME" \
            --arg cs  "$RACKSPACE_CLOUDSPACE_NAME" \
            --arg rt  "$RACKSPACE_REFRESH_TOKEN" \
            '{organization_name:$org, cloudspace_name:$cs, refresh_token:$rt}')
          http_status=$(curl -sS -o /tmp/spot-response.json -w '%{http_code}' \
            -X POST 'https://spot.rackspace.com/apis/auth.ngpc.rxt.io/v1/generate-kubeconfig' \
            -H 'Content-Type: application/json' \
            --data "$payload")
          if [ "$http_status" != "200" ]; then
            echo "::error::Rackspace API returned HTTP $http_status. Refresh token may be expired."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/kube"
          jq -er '.data.kubeconfig' /tmp/spot-response.json > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          rm -f /tmp/spot-response.json
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Compare production schema with what the code expects
        run: |
          set -euo pipefail
          readonly_sql="$RUNNER_TEMP/schema-drift.sql"
          cat > "$readonly_sql" <<'SQL'
          BEGIN TRANSACTION READ ONLY;

          \echo === COLUMNAS Y TABLAS QUE ESPERA EL CODIGO (presente = t) ===
          SELECT e.tabla, e.columna, e.origen,
            EXISTS (
              SELECT 1 FROM information_schema.columns ic
              WHERE ic.table_schema = 'public' AND ic.table_name = e.tabla AND ic.column_name = e.columna
            ) AS presente
          FROM (VALUES
            ('ChallengeInvitation', 'recipientEmail', '20261004120000_add_challenge_invitation_lifecycle (Ola 0)'),
            ('ChallengeInvitation', 'invitationStatus', '20261004120000_add_challenge_invitation_lifecycle (Ola 0)'),
            ('StrategicFront', 'constraints', '20261004180000_add_front_constraints_challenge_envelope (Ola 2)'),
            ('Challenge', 'knownFacts', '20261004180000_add_front_constraints_challenge_envelope (Ola 2)'),
            ('Challenge', 'openQuestions', '20261004180000 (Ola 2)'),
            ('Challenge', 'constraints', '20261004180000 (Ola 2)'),
            ('Challenge', 'dependencies', '20261004180000 (Ola 2)'),
            ('Challenge', 'expectedDecision', '20261004180000 (Ola 2)'),
            ('PortfolioLearning', 'id', '20261004200000_add_portfolio_learning (Ola 4)'),
            ('OrganizationPortfolioAccessGrant', 'id', 'grants de portafolio (usado por portfolio-scope, #136)'),
            ('InitiativeGovernance', 'id', 'autoridad de decisión (#131)')
          ) AS e(tabla, columna, origen)
          ORDER BY presente, e.tabla, e.columna;

          \echo === MIGRACIONES REGISTRADAS POR PRISMA (si la tabla existe) ===
          SELECT to_regclass('public._prisma_migrations') IS NOT NULL AS hay_tabla_de_migraciones;

          ROLLBACK;
          SQL

          unsafe_pattern="$(printf '%s|' INS'ERT' UP'DATE' DEL'ETE' AL'TER' DR'OP' CR'EATE' TRUN'CATE')"
          unsafe_pattern="${unsafe_pattern%|}"
          if grep -Eiq "\\b(${unsafe_pattern})\\b" "$readonly_sql"; then
            echo "::error::Readonly audit SQL contains a mutating statement."
            exit 1
          fi

          kubectl exec -i -n "$NAMESPACE" statefulset/starteria-db -- \
            psql -U starteria -d starteria_db -P pager=off -v ON_ERROR_STOP=1 \
            -f - < "$readonly_sql"

      - name: Cleanup kubeconfig
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kube/config" || true
