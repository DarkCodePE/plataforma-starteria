# Deriva de schema de solo lectura: compara la base de producción con lo que espera el código.
# El CD restaurado NO aplica schema (STARTERIA_CD_RESTORATION_REPORT.md §9), así que cada
# migración nueva hay que confirmarla acá antes de que el código que la usa llegue a producción.
# Mismo patrón que db-adaptive-cycle-readonly.yml: READ ONLY + ROLLBACK + guard.
name: DB Schema Drift (readonly)

on:
  workflow_dispatch:

concurrency:
  group: db-schema-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: starteria

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Fetch kubeconfig from Rackspace Spot API
        env:
          RACKSPACE_REFRESH_TOKEN: ${{ secrets.RACKSPACE_REFRESH_TOKEN }}
          RACKSPACE_ORG_NAME: ${{ secrets.RACKSPACE_ORG_NAME }}
          RACKSPACE_CLOUDSPACE_NAME: ${{ secrets.RACKSPACE_CLOUDSPACE_NAME }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg org "$RACKSPACE_ORG_NAME" \
            --arg cs  "$RACKSPACE_CLOUDSPACE_NAME" \
            --arg rt  "$RACKSPACE_REFRESH_TOKEN" \
            '{organization_name:$org, cloudspace_name:$cs, refresh_token:$rt}')
          http_status=$(curl -sS -o /tmp/spot-response.json -w '%{http_code}' \
            -X POST 'https://spot.rackspace.com/apis/auth.ngpc.rxt.io/v1/generate-kubeconfig' \
            -H 'Content-Type: application/json' \
            --data "$payload")
          if [ "$http_status" != "200" ]; then
            echo "::error::Rackspace API returned HTTP $http_status. Refresh token may be expired."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/kube"
          jq -er '.data.kubeconfig' /tmp/spot-response.json > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          rm -f /tmp/spot-response.json
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Compare production schema with what the code expects
        run: |
          set -euo pipefail
          readonly_sql="$RUNNER_TEMP/schema-drift.sql"
          cat > "$readonly_sql" <<'SQL'
          BEGIN TRANSACTION READ ONLY;

          \echo === COLUMNAS Y TABLAS QUE ESPERA EL CODIGO (presente = t) ===
          SELECT e.tabla, e.columna, e.origen,
            EXISTS (
              SELECT 1 FROM information_schema.columns ic
              WHERE ic.table_schema = 'public' AND ic.table_name = e.tabla AND ic.column_name = e.columna
            ) AS presente
          FROM (VALUES
            ('ChallengeInvitation', 'recipientEmail', '20261004120000_add_challenge_invitation_lifecycle (Ola 0)'),
            ('ChallengeInvitation', 'invitationStatus', '20261004120000_add_challenge_invitation_lifecycle (Ola 0)'),
            ('StrategicFront', 'constraints', '20261004180000_add_front_constraints_challenge_envelope (Ola 2)'),
            ('Challenge', 'knownFacts', '20261004180000_add_front_constraints_challenge_envelope (Ola 2)'),
            ('Challenge', 'openQuestions', '20261004180000 (Ola 2)'),
            ('Challenge', 'constraints', '20261004180000 (Ola 2)'),
            ('Challenge', 'dependencies', '20261004180000 (Ola 2)'),
            ('Challenge', 'expectedDecision', '20261004180000 (Ola 2)'),
            ('PortfolioLearning', 'id', '20261004200000_add_portfolio_learning (Ola 4)'),
            ('OrganizationPortfolioAccessGrant', 'id', 'grants de portafolio (usado por portfolio-scope, #136)'),
            ('InitiativeGovernance', 'id', 'autoridad de decisión (#131)')
          ) AS e(tabla, columna, origen)
          ORDER BY presente, e.tabla, e.columna;

          \echo === MIGRACIONES DEL REPO SIN APLICAR EN PRODUCCION (segun _prisma_migrations) ===
          SELECT r.migration_name
          FROM (VALUES
            ('20260414220131_add_portfolio_lead_models'),
            ('20260519000000_pdf_autofill'),
            ('20260519010000_steps_234_persistence'),
            ('20260520003229_pdf_extraction_run_ai_run_id'),
            ('20260523120000_pdf_extraction_run_ai_run_id_index'),
            ('20260529000000_add_oauth_fields_to_user'),
            ('20260529120000_add_pilot_lead'),
            ('20260710090000_initial_review_flow'),
            ('20260711120000_company_context'),
            ('20260726170000_copilot_foundation_block_01'),
            ('20260726183000_add_user_organization_scalar_for_copilot'),
            ('20260727093000_copilot_block_03_unknown_assessment'),
            ('20260727120000_copilot_production_hardening'),
            ('20260728100000_add_missing_b2b_billing_tables_for_clean_migrations'),
            ('20260729120000_adaptive_core_step0_cycle'),
            ('20260805000000_add_portfolio_lead_role'),
            ('20260810090000_r1_truth_foundation'),
            ('20260810120000_r1_truth_integrity_review_fix'),
            ('20260816120000_r3a_cycle_foundation'),
            ('20260817120000_r3b1_critical_change_assessment'),
            ('20260819120000_r3c2a_governance_foundation'),
            ('20260820120000_r3c3a_decision_request_foundation'),
            ('20260820120000_sync_dbpush_drift_roles_pilot_claim'),
            ('20260820150000_r3c4a_organizational_decision_foundation'),
            ('20260820170000_r3c5_decision_effects_continuation_route'),
            ('20260822130000_challenge_activation_authoring'),
            ('20260829120000_adr030_challenge_paused_state'),
            ('20260911120000_add_portfolio_entry_sessions_precanonical'),
            ('20260911150000_add_portfolio_entry_api_idempotency'),
            ('20260912120000_add_portfolio_entry_conversion_boundary'),
            ('20260912170000_add_portfolio_entry_portfolio_continuation'),
            ('20260914103000_add_portfolio_bootstrap_session_anchor'),
            ('20260914113000_add_portfolio_bootstrap_work_intake'),
            ('20260914120000_add_portfolio_bootstrap_analysis_proposals'),
            ('20260914123000_add_portfolio_bootstrap_material_review'),
            ('20260914130000_add_portfolio_bootstrap_first_reading'),
            ('20260914150000_add_portfolio_bootstrap_import_batches'),
            ('20260924120000_add_strategic_framing_provisional_state'),
            ('20260925100000_add_scoped_portfolio_access_grants'),
            ('20260928120000_add_portfolio_handoff_assignment'),
            ('20260928133000_add_portfolio_handoff_invitation_access'),
            ('20260928150000_add_portfolio_handoff_delivery'),
            ('20260928170000_add_portfolio_handoff_response'),
            ('20260928190000_add_portfolio_handoff_start'),
            ('20260928210000_add_portfolio_handoff_semantic_events'),
            ('20261004120000_add_challenge_invitation_lifecycle'),
            ('20261004180000_add_front_constraints_challenge_envelope'),
            ('20261004200000_add_portfolio_learning')
          ) AS r(migration_name)
          WHERE NOT EXISTS (
            SELECT 1 FROM _prisma_migrations pm
            WHERE pm.migration_name = r.migration_name AND pm.finished_at IS NOT NULL AND pm.rolled_back_at IS NULL
          )
          ORDER BY 1;

          \echo === ULTIMAS MIGRACIONES REGISTRADAS EN PRODUCCION ===
          SELECT migration_name, finished_at, rolled_back_at
          FROM _prisma_migrations
          ORDER BY started_at DESC
          LIMIT 8;

          ROLLBACK;
          SQL

          unsafe_pattern="$(printf '%s|' INS'ERT' UP'DATE' DEL'ETE' AL'TER' DR'OP' CR'EATE' TRUN'CATE')"
          unsafe_pattern="${unsafe_pattern%|}"
          if grep -Eiq "\\b(${unsafe_pattern})\\b" "$readonly_sql"; then
            echo "::error::Readonly audit SQL contains a mutating statement."
            exit 1
          fi

          kubectl exec -i -n "$NAMESPACE" statefulset/starteria-db -- \
            psql -U starteria -d starteria_db -P pager=off -v ON_ERROR_STOP=1 \
            -f - < "$readonly_sql"

      - name: Cleanup kubeconfig
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kube/config" || true
