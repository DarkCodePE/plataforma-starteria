# CI pipeline — Phase 0
# Owner: CI-WORKFLOW agent (swarm)
# Scope: monorepo (front/ + ai-service/)
# Contract:
#   - front/ exposes npm scripts: test:backend, test:front, test:coverage, build
#   - ai-service/ uses uv + pytest with markers (unit/integration/contract)
# No secrets are required for this workflow at the moment.

name: CI

on:
  pull_request:
    branches: ['**']
  # No standalone `push: main` trigger: cd.yml runs on every push to main and
  # its `tests` gate calls this workflow, so a separate run would duplicate the
  # exact same suite.
  # Note: this workflow's `concurrency` group below uses `github.workflow`, which
  # in a `workflow_call` resolves to the CALLER (`CD`). Two concurrent CD runs
  # would therefore cancel each other's CI. That is currently impossible because
  # cd.yml serializes on `group: starteria-production` with
  # `cancel-in-progress: false`. Do not loosen that without fixing this group.
  workflow_call:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions for the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Node tests (vitest, backend + front + coverage gate)
  # ---------------------------------------------------------------------------
  node-tests:
    name: Node tests (vitest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run Portfolio Entry v0.2 isolated validation
        # Candidate-only deterministic validation. It does not promote v0.2,
        # mutate product state, or replace the v0.1 consumer test surface.
        run: npm exec -- vitest run --config vitest.backend.config.ts ../test/portfolio-entry-v02-isolated-validation/isolated-validation.test.ts

      - name: Run tests with coverage
        # The coverage threshold (>=80%) is enforced by vitest config (fail_under).
        # If coverage drops below the gate, this step exits non-zero and the job fails.
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: front-coverage
          path: front/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 2: Python tests (ai-service, pytest unit suite)
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python tests (pytest -m unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            ai-service/uv.lock
            ai-service/pyproject.toml

      - name: Install dependencies (uv sync --all-extras)
        run: uv sync --all-extras

      - name: Run unit tests with coverage
        run: uv run pytest -m unit --cov --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-service-coverage
          path: ai-service/coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 3: Lint + build (Node tsc/vite build, Python ruff check)
  # Independent of test jobs so a flaky test does not mask a broken build.
  # ---------------------------------------------------------------------------
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Node side -----
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Node deps (npm ci)
        working-directory: ./front
        run: npm ci

      - name: Build front (vite + tsc)
        working-directory: ./front
        # `npm run build` runs `vite build`; tsc errors will surface here.
        run: npm run build

      # ----- Python side -----
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            ai-service/uv.lock
            ai-service/pyproject.toml

      - name: Install Python deps (uv sync)
        working-directory: ./ai-service
        run: uv sync --all-extras

      - name: Ruff check (advisory in Phase 0)
        working-directory: ./ai-service
        # TODO(Phase 1): drop --exit-zero once a [tool.ruff] config is added to
        # ai-service/pyproject.toml and the existing code passes the chosen ruleset.
        run: uv run ruff check . --exit-zero

  # ---------------------------------------------------------------------------
  # Job 4: E2E light (Portfolio Entry -> Portfolio Home smoke)
  # ---------------------------------------------------------------------------
  e2e-light:
    name: E2E light (Portfolio Entry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Portfolio Entry smoke
        run: npm run test:e2e -- e2e/portfolio-entry-conversion.spec.ts

  # ---------------------------------------------------------------------------
  # Job 5: Aggregate summary — runs even on partial failure to give one place
  # to read the verdict in PR checks.
  # ---------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [node-tests, python-tests, lint-and-build, e2e-light]
    if: always()
    steps:
      - name: Write Markdown summary
        env:
          NODE_RESULT: ${{ needs.node-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
          E2E_LIGHT_RESULT: ${{ needs.e2e-light.result }}
        run: |
          {
            echo "# CI summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| node-tests      | ${NODE_RESULT} |"
            echo "| python-tests    | ${PYTHON_RESULT} |"
            echo "| lint-and-build  | ${LINT_RESULT} |"
            echo "| e2e-light       | ${E2E_LIGHT_RESULT} |"
            echo ""
            if [ "${NODE_RESULT}" = "success" ] && [ "${PYTHON_RESULT}" = "success" ] && [ "${LINT_RESULT}" = "success" ] && [ "${E2E_LIGHT_RESULT}" = "success" ]; then
              echo "All required jobs passed."
            else
              echo "One or more required jobs did not succeed. See the failed job logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if any required job failed
        env:
          NODE_RESULT: ${{ needs.node-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
          E2E_LIGHT_RESULT: ${{ needs.e2e-light.result }}
        run: |
          if [ "${NODE_RESULT}" != "success" ] || [ "${PYTHON_RESULT}" != "success" ] || [ "${LINT_RESULT}" != "success" ] || [ "${E2E_LIGHT_RESULT}" != "success" ]; then
            echo "::error::At least one required job failed (node=${NODE_RESULT}, python=${PYTHON_RESULT}, lint=${LINT_RESULT}, e2e-light=${E2E_LIGHT_RESULT})"
            exit 1
          fi
