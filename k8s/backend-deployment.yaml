apiVersion: apps/v1
kind: Deployment
metadata:
  name: starteria-backend
  namespace: starteria
  labels:
    app: starteria-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: starteria-backend
  template:
    metadata:
      labels:
        app: starteria-backend
    spec:
      # appgroup (1001) del Dockerfile.backend: el volumen queda escribible para appuser.
      securityContext:
        fsGroup: 1001
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: starteria-backend-storage
      containers:
      - name: backend
        image: orlandogtp/starteria-backend:v2.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        # Secret synced by .github/workflows/cd.yml at deploy time.
        # Provides: DATABASE_URL, JWT_SECRET, AI_SERVICE_TOKEN, AI_SERVICE_URL,
        # BRIDGE_SHARED_SECRET, SMTP_HOST, SMTP_USER, SMTP_PASS, PILOT_LEAD_NOTIFY_FROM.
        - secretRef:
            name: starteria-backend-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: JWT_EXPIRES_IN
          value: "15m"
        - name: JWT_REFRESH_EXPIRES_IN
          value: "7d"
        - name: CORS_ORIGIN
          value: "https://starter-ia.com"
        - name: LOG_LEVEL
          value: "info"
        # PDFs subidos (iniciativa y Feedback IA del Step 4), en el volumen persistente.
        - name: LOCAL_STORAGE_DIR
          value: "/app/storage"
        # Portfolio Entry uses the backend Responses adapter. Set
        # PORTFOLIO_ENTRY_API_KEY in starteria-backend-secrets (envFrom above).
        # Provider/model/URL/timeouts may be overridden in that Secret too.
        - name: PORTFOLIO_ENTRY_RUNTIME_MODE
          value: "live"
        - name: PORTFOLIO_ENTRY_SYNTHESIS_TIMEOUT_MS
          value: "120000"
        - name: PORTFOLIO_ENTRY_CRITICAL_HANDOFF_MAX_MS
          value: "180000"
        # Revisión inicial guiada (CC-02/CC-03): "real" usa el ai-service
        # (/api/v1/ai/initial-review) con fallback automático al mock si falla
        # (un fallback aparece como warn "initial-review AI fallback" en logs).
        # Vacío o ausente = mock determinista. "real-strict" = sin fallback (debug).
        - name: INITIAL_REVIEW_AI
          value: "real"
        # Pilot-lead email notification (issue #54). Non-secret config; SMTP
        # credentials + from-address come from the synced Secret above. The team
        # inbox below receives the new-lead notification — edit to the real address.
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_SECURE
          value: "false"
        - name: PILOT_LEAD_NOTIFY_TO
          value: "okuanb@gmail.com"
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
