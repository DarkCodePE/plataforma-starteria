server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF auto-fill (PRD-002): allow uploads up to backend MAX_PDF_BYTES (50MB).
    # Without this, nginx default 1MB cap rejects any PDF >1MB with 413 before
    # the request even reaches the Express upload route.
    client_max_body_size 60M;
    client_body_buffer_size 1M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets — filenames are content-hashed by Vite, so they can
    # be cached forever (a new build produces new filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry point — must NEVER be cached by the browser. index.html is the
    # only non-hashed file and points at the current hashed bundle; if the
    # browser caches it (nginx sent no Cache-Control before, so browsers applied
    # heuristic caching) the user keeps running an old bundle after a deploy —
    # e.g. the pre-ADR-019 `/`→`/auth` rebote persisting for cached visitors
    # (issue #119). `no-cache` = revalidate before use (304 via ETag is cheap).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — serve index.html for all non-file routes. The internal
    # redirect to /index.html re-matches the exact location above, so SPA routes
    # (/, /auth, /projects/...) all inherit the no-cache header.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://starteria-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La conclusión de Portfolio Entry (síntesis crítica) tarda ~60 s y el backend le da hasta
        # 90 s; el default de 60 s de nginx la cortaba con 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
