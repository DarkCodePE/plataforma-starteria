services:
  postgres:
    image: postgres:16-alpine
    container_name: starteria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starteria_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated pgvector instance for the pdf_extractor spike (ai-service/spikes/pdf_extractor).
  # NOT used by backend/. Remove this service when the spike is promoted or abandoned.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: starteria-pgvector
    restart: unless-stopped
    profiles: ["spike"]
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-starteria_pdf_spike}
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - pgvectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: starteria-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-starteria_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see backend/.env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # PDF auto-fill (PRD-002 / SPEC-002)
      LOCAL_STORAGE_DIR: /app/storage
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-shared-secret-change-me}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET:-dev-shared-secret-change-me}
      PORTFOLIO_ENTRY_RUNTIME_MODE: ${PORTFOLIO_ENTRY_RUNTIME_MODE:-live}
      PORTFOLIO_ENTRY_PROVIDER: ${PORTFOLIO_ENTRY_PROVIDER:-openai_responses}
      PORTFOLIO_ENTRY_MODEL: ${PORTFOLIO_ENTRY_MODEL:-gpt-5.6-luna}
      PORTFOLIO_ENTRY_API_KEY: ${PORTFOLIO_ENTRY_API_KEY:-}
      PORTFOLIO_ENTRY_BASE_URL: ${PORTFOLIO_ENTRY_BASE_URL:-}
      PORTFOLIO_ENTRY_TIMEOUT_MS: ${PORTFOLIO_ENTRY_TIMEOUT_MS:-30000}
      PORTFOLIO_ENTRY_SYNTHESIS_TIMEOUT_MS: ${PORTFOLIO_ENTRY_SYNTHESIS_TIMEOUT_MS:-120000}
      PORTFOLIO_ENTRY_SYNTHESIS_REASONING_EFFORT: ${PORTFOLIO_ENTRY_SYNTHESIS_REASONING_EFFORT-low}
      PORTFOLIO_ENTRY_CRITICAL_HANDOFF_MAX_MS: ${PORTFOLIO_ENTRY_CRITICAL_HANDOFF_MAX_MS:-180000}
      # Revisión inicial guiada (CC-02): vacío=mock, real=IA con fallback, real-strict=sin fallback.
      INITIAL_REVIEW_AI: ${INITIAL_REVIEW_AI:-}
    volumes:
      - pdfstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Relative path → nginx (sidecar) proxies /api/* to starteria-backend:3001.
        # This avoids CORS entirely (same-origin requests) and matches the auth router
        # mounted at /api/v1/* in backend/app.ts.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_FEATURE_PDF_AUTOFILL: ${VITE_FEATURE_PDF_AUTOFILL:-true}
    container_name: starteria-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_FEATURE_PDF_AUTOFILL: ${VITE_FEATURE_PDF_AUTOFILL:-true}
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: starteria-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    # Read OPENROUTER_API_KEY (and other ai-service-specific keys) directly from
    # ai-service/.env. Without this, docker-compose only interpolates from the
    # root .env, so a key placed in ai-service/.env never reaches the container
    # and pdf_extractor.extractor._build_llm() raises RuntimeError on every run.
    env_file:
      - ./ai-service/.env
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # deepseek-chat divagaba y truncaba JSON estructurado (1/3 en benchmark);
      # v4-flash: 3/3 confiable, 15-17s, $0.0004/call (benchmark 2026-07-12).
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      - ENVIRONMENT=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-starteria-ai-service}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      # PDF auto-fill (TASK-007 bridge V1; matches backend AI_SERVICE_TOKEN)
      - AI_SERVICE_INTERNAL_TOKEN=${AI_SERVICE_TOKEN:-dev-shared-secret-change-me}
      - EVAL_COST_CAP_USD=${EVAL_COST_CAP_USD:-0.30}
      # Outbound push: when an extraction finishes, ai-service POSTs the run state
      # to backend so the DB is updated even when no frontend is polling. The
      # backend listens at /api/v1/internal/ai/webhooks/pdf-extract/runs/:aiRunId.
      # Token is the same shared secret used in the inbound direction so rotation
      # stays single-keyed. Leave BACKEND_WEBHOOK_URL empty to disable the push
      # (the backend's reactive polling path is the fallback).
      - BACKEND_WEBHOOK_URL=${BACKEND_WEBHOOK_URL:-http://backend:3001/api/v1/internal/ai/webhooks/pdf-extract/runs}
      - BACKEND_WEBHOOK_TOKEN=${AI_SERVICE_TOKEN:-dev-shared-secret-change-me}
    depends_on:
      - backend

volumes:
  pgdata:
  pgvectordata:
  pdfstorage:
